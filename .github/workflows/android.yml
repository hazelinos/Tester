name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME##*/}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Montra-v${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Montra-APK
          path: out/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          tag_name: v${{ startsWith(github.ref, 'refs/heads/release/') && github.ref_name || github.ref_name }}
          generate_release_notes: true
